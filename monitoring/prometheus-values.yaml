prometheus:

  prometheusSpec:

    retention: 2d

    retentionSize: 150MB

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    storageSpec:

      volumeClaimTemplate:

        spec:

          accessModes:
            - ReadWriteOnce

          resources:
            requests:
              storage: 200Mi