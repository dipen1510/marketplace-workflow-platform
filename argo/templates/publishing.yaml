apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate

metadata:
  name: marketplace-publishing
  namespace: argo

spec:
  entrypoint: publishing

  arguments:
    parameters:
      - name: failureMode
        value: success

  templates:

    # ==========================================
    # Main publishing DAG
    # ==========================================

    - name: publishing

      metrics:
      prometheus:

      # ------------------------------------------
      # Overall workflow result
      # ------------------------------------------
        - name: marketplace_workflow_result_total

          help: "Total Marketplace workflows by final result"

          labels:
            - key: workflow_type
              value: publishing

            - key: status
              value: "{{status}}"

          counter:
            value: "1"

      # ------------------------------------------
      # Overall workflow duration
      # ------------------------------------------
        - name: marketplace_workflow_duration_seconds

          help: "Marketplace workflow execution duration in seconds"

          labels:
            - key: workflow_type
              value: publishing

          histogram:

            buckets:
              - 10
              - 30
              - 60
              - 120
              - 300
              - 600

            value: "{{duration}}"

      dag:
        tasks:

          - name: discover
            template: discover

          - name: validate
            dependencies:
              - discover
            template: validate

          - name: publish
            dependencies:
              - validate
            template: publish

    # ==========================================
    # Step 1 - Discover
    # ==========================================

    - name: discover

      metrics:
      prometheus:

        - name: marketplace_workflow_step_result_total

          help: "Total Marketplace workflow step executions by result"

          labels:
            - key: workflow_type
              value: publishing

            - key: step
              value: discover

            - key: status
              value: "{{status}}"

          counter:
            value: "1"

        - name: marketplace_workflow_step_duration_seconds

          help: "Marketplace workflow step execution duration in seconds"

          labels:
            - key: workflow_type
              value: publishing

            - key: step
              value: discover

          histogram:

            buckets:
              - 1
              - 5
              - 10
              - 30
              - 60
              - 120
              - 300

            value: "{{duration}}"


      container:

        image: marketplace-worker:v0.2.0

        imagePullPolicy: IfNotPresent

        command:
          - /usr/local/bin/marketplace-worker

        args:
          - --operation=discover

    # ==========================================
    # Step 2 - Validate
    # ==========================================

    - name: validate

      retryStrategy:

        # Initial execution + 2 retries
        # = maximum 3 total attempts
        limit: "2"

        retryPolicy: "OnFailure"

        # Only exit code 10 is retryable
        expression: "lastRetry.exitCode == '10'"

        backoff:
          duration: "5s"
          factor: 2

      metrics:
      prometheus:

      # ------------------------------------------
      # Logical final status of validate
      # ------------------------------------------
        - name: marketplace_workflow_step_result_total

          help: "Total Marketplace workflow step executions by result"

          labels:
            - key: workflow_type
              value: publishing

            - key: step
              value: validate

            - key: status
              value: "{{status}}"

          counter:
            value: "1"

      # ------------------------------------------
      # Number of retries used
      # ------------------------------------------
        - name: marketplace_workflow_step_retry_total

          help: "Total Marketplace workflow step retries"

          labels:
            - key: workflow_type
              value: publishing

            - key: step
              value: validate

          counter:
            value: "{{retries}}"

      # ------------------------------------------
      # Logical step duration
      # ------------------------------------------
        - name: marketplace_workflow_step_duration_seconds

          help: "Marketplace workflow step execution duration in seconds"

          labels:
            - key: workflow_type
              value: publishing

            - key: step
              value: validate

          histogram:

            buckets:
              - 1
              - 5
              - 10
              - 30
              - 60
              - 120
              - 300

            value: "{{duration}}"

      container:

        image: marketplace-worker:v0.2.0

        imagePullPolicy: IfNotPresent

        command:
          - /usr/local/bin/marketplace-worker

        args:
          - --operation=validate
          - --failure-mode={{workflow.parameters.failureMode}}
          - --attempt={{retries}}

    # ==========================================
    # Step 3 - Publish
    # ==========================================

    - name: publish

      retryStrategy:

        limit: "2"

        retryPolicy: "OnFailure"

        expression: "lastRetry.exitCode == '10'"

        backoff:
          duration: "5s"
          factor: 2

      metrics:
      prometheus:

        - name: marketplace_workflow_step_result_total

          help: "Total Marketplace workflow step executions by result"

          labels:
            - key: workflow_type
              value: publishing

            - key: step
              value: publish

            - key: status
              value: "{{status}}"

          counter:
            value: "1"

        - name: marketplace_workflow_step_retry_total

          help: "Total Marketplace workflow step retries"

          labels:
            - key: workflow_type
              value: publishing

            - key: step
              value: publish

          counter:
            value: "{{retries}}"

        - name: marketplace_workflow_step_duration_seconds

          help: "Marketplace workflow step execution duration in seconds"

          labels:
            - key: workflow_type
              value: publishing

            - key: step
              value: publish

          histogram:

            buckets:
              - 1
              - 5
              - 10
              - 30
              - 60
              - 120
              - 300

            value: "{{duration}}"


      container:

        image: marketplace-worker:v0.2.0

        imagePullPolicy: IfNotPresent

        command:
          - /usr/local/bin/marketplace-worker

        args:
          - --operation=publish
          - --failure-mode={{workflow.parameters.failureMode}}
          - --attempt={{retries}}