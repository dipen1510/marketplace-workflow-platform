apiVersion: v1
kind: ServiceAccount

metadata:
  name: marketplace-status-controller
  namespace: marketplace-system

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: marketplace-status-controller
  namespace: argo

rules:

  - apiGroups:
      - argoproj.io

    resources:
      - workflows

    verbs:
      - get
      - list
      - watch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: marketplace-status-controller
  namespace: argo

subjects:

  - kind: ServiceAccount
    name: marketplace-status-controller
    namespace: marketplace-system

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: marketplace-status-controller